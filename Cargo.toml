[package]
name = "claude-usage-widget"
version = "0.1.0"
edition = "2021"
description = "Windows taskbar widget showing Claude 5-hour and 7-day rate-limit usage"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4.45"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
ureq = { version = "3.3.0", default-features = false, features = ["native-tls", "gzip", "win-system-proxy"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_Security"] }
zeroize = "1.9.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
