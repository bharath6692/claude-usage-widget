# The WinLibs mingw-w64 package installed for as.exe/dlltool.exe (see
# scripts/cargo.ps1) does not ship a full CRT sysroot for this target
# (no crt2.o / libkernel32.a under its own tree). rustup's toolchain bundles
# its own pre-built copies of exactly these pieces; self-contained linking
# tells rustc to use those instead of searching the external mingw install.
# (The granular `+mingw` form is nightly-only; `yes` is the stable equivalent.)
#
# The companion `-C dlltool=<wrapper>` flag is NOT set here: it must be an
# absolute path, which depends on where the repo is cloned. scripts/cargo.ps1
# computes it at build time and adds it via `--config` (cargo merges the two
# rustflags lists).
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "link-self-contained=yes",
]
